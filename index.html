<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangladesh Today ফটোকার্ড মেকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--card:#ffffff;--ink:#1b1b1b;--sub:#666;--line:#dcdcd8;--accent:#e3180a;--accent-ink:#fff;--field:#fafaf9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
}
:root[data-theme="dark"]{--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 2px 12px;font-weight:700}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:0;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.14)}
canvas{display:block;margin:0 auto;width:auto;max-width:100%;height:min(44vh,calc((100vw - 56px)*1.25));aspect-ratio:1080/1350;border-radius:8px;background:#ddd}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
label:first-child{margin-top:0}
.hint{color:var(--sub);font-size:13px;font-weight:400}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.row label{margin:0;flex:1}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
button,.filebtn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;width:100%;display:block;text-align:center}
.filebtn{background:var(--field);color:var(--ink);border:1px dashed var(--sub)}
.primary{background:var(--accent);color:var(--accent-ink);margin-top:14px;font-size:18px}
.secondary{background:var(--field);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.acc{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.acc summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;padding:10px 2px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";color:var(--accent);font-size:20px;line-height:1}
.acc[open] summary::after{content:"－"}
.accbody{padding-bottom:6px}
textarea{min-height:70px}
.qc{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
.qd{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input[type=text]{flex:1;min-width:0}
.row input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);flex:none;cursor:pointer}
.row .x{width:38px;flex:none;padding:10px 0;background:var(--field);color:var(--sub);border:1px solid var(--line);border-radius:10px}
.lr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--field)}
.lr .row{margin-top:0}
.lr input[type=text]{background:var(--card)}
.sub{margin-top:8px}
.sub summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);padding:6px 0;list-style:none}
.sub summary::-webkit-details-marker{display:none}
.sub label{font-size:14px;margin:8px 0 2px}
.sub .secondary{margin-top:10px;padding:9px 12px;font-size:14px;background:var(--card)}
#msg{margin-top:10px;font-size:14px;color:var(--sub);min-height:20px}
#fallback{display:none;margin-top:12px}
#fallback img{width:100%;border-radius:8px}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>Bangladesh Today ফটোকার্ড</h1>

  <div class="preview"><canvas id="cv" width="1080" height="1350" aria-label="ফটোকার্ডের প্রিভিউ"></canvas></div>

  <div class="panel">
    <label class="filebtn" for="photo" id="photoLbl">ছবি বাছুন</label>
    <input type="file" id="photo" accept="image/*">
    <details class="acc">
      <summary>ছবি বড়-ছোট / সরানো</summary>
      <div class="accbody">
        <label>ছবি বড়-ছোট করুন</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
        <label>ছবি ডানে-বামে</label>
        <input type="range" id="px" min="0" max="100" value="50">
        <label>ছবি উপরে-নিচে</label>
        <input type="range" id="py" min="0" max="100" value="35">
      </div>
    </details>
  </div>

  <div class="panel">
    <label>শিরোনাম <span class="hint">(প্রতি লাইনে আলাদা লেখা, রং, সাইজ ও জায়গা)</span></label>
    <div class="qc" id="qc" aria-label="দ্রুত রং"></div>
    <div id="rows"></div>
    <button class="secondary" id="addRow" type="button">＋ নতুন লাইন যোগ করুন</button>
    <details class="acc">
      <summary>লেখার সেটিং (সবার জন্য: মোটা-চিকন, সাইজ, ফাঁক)</summary>
      <div class="accbody">
        <label for="bold">লেখা মোটা-চিকন: <span id="boldVal">৮</span> <span class="hint">(১ = চিকন, ১০ = মোটা, ১২ = সবচেয়ে মোটা)</span></label>
        <input type="range" id="bold" min="1" max="12" value="8">
        <div class="check"><input type="checkbox" id="equal" checked><label for="equal" style="margin:0">সব লাইন সমান সাইজ</label></div>
        <div class="check"><input type="checkbox" id="wrapLines" checked><label for="wrapLines" style="margin:0">লম্বা লেখা অটো ভেঙে সমান লাইনে সাজাও</label></div>
        <div class="check"><input type="checkbox" id="autoSize" checked><label for="autoSize" style="margin:0">লেখার সাইজ অটো</label></div>
        <label for="tsize">লেখার সাইজ: <span id="tsizeVal">৭০</span> <span class="hint">(অটো বন্ধ করলে কাজ করবে)</span></label>
        <input type="range" id="tsize" min="30" max="170" value="70" disabled>
        <label for="gap">লাইনের মাঝের ফাঁক: <span id="gapVal">৮</span></label>
        <input type="range" id="gap" min="0" max="60" value="8">
        <label for="tstretch">লেখা লম্বা করুন: <span id="tstretchVal">১১২</span>% <span class="hint">(১০০ = স্বাভাবিক)</span></label>
        <input type="range" id="tstretch" min="100" max="125" value="112">
      </div>
    </details>
  </div>

  <div class="panel">
    <details class="acc" style="margin-top:0">
      <summary>ক্যাপশন, ক্যাটাগরি, তারিখ, ডান পাশের লেখা</summary>
      <div class="accbody">
        <label for="caption">ছবির ক্যাপশন <span class="hint">(ঐচ্ছিক)</span></label>
        <textarea id="caption" placeholder="ছবির নিচে ছোট করে যা লিখতে চান" style="min-height:64px"></textarea>

        <label for="cat">ক্যাটাগরি <span class="hint">(ঐচ্ছিক)</span></label>
        <input type="text" id="cat" value="বাংলাদেশ">

        <div class="check"><input type="checkbox" id="useDate" checked><label for="useDate" style="margin:0">তারিখ দেখাও</label></div>
        <input type="date" id="date">

        <label for="rightTxt">নিচে ডান পাশের লেখা <span class="hint">(ঐচ্ছিক)</span></label>
        <input type="text" id="rightTxt" placeholder="খালি রাখলে কিছু দেখাবে না">
      </div>
    </details>
  </div>

  <button class="primary" id="save">ফটোকার্ড সেভ করুন</button>
  <button class="secondary" id="share" style="display:none">শেয়ার করুন</button>
  <div id="msg" role="status"></div>
  <div id="fallback"><p style="font-weight:700;margin:0 0 8px">তৈরি ফটোকার্ড <span class="hint">(সেভ না হলে ছবিতে চেপে ধরে "ছবি সংরক্ষণ" দিন)</span></p><img id="outImg" alt="তৈরি ফটোকার্ড"></div>
</main>

const W=1080,H=1350,SEAM=820;
const PANEL='#f2f3f3',FOOT='#e6e7e7',RED='#e3180a',INK='#1a1a1a';
const FONT="'Hind Siliguri','Noto Sans Bengali','Kalpurush',sans-serif";
const MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

function bn(n){return String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d])}
function fmtDate(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return '';
  return bn(parseInt(m[3],10))+' '+MONTHS[parseInt(m[2],10)-1]+' '+bn(m[1]);
}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}

function wrap(text,maxW){
  const out=[];
  text.split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){return}
    let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(ctx.measureText(t).width<=maxW||!line){line=t}else{out.push(line);line=w}
    });
    out.push(line);
  });
  return out;
}

const M=16; // হালকা ফ্রেমের মাপ
function drawPhoto(){
  const PX=M,PY=M,PW=W-2*M,PH=SEAM-M;
  ctx.fillStyle=PANEL;ctx.fillRect(0,0,W,SEAM);
  ctx.save();
  ctx.beginPath();
  const r=14;
  ctx.moveTo(PX,PY+PH);ctx.lineTo(PX,PY+r);ctx.quadraticCurveTo(PX,PY,PX+r,PY);
  ctx.lineTo(PX+PW-r,PY);ctx.quadraticCurveTo(PX+PW,PY,PX+PW,PY+r);ctx.lineTo(PX+PW,PY+PH);ctx.closePath();
  ctx.clip();
  if(photo){
    const z=$('zoom').value/100,px=$('px').value/100,py=$('py').value/100;
    const s=Math.max(PW/photo.width,PH/photo.height)*z;
    const dw=photo.width*s,dh=photo.height*s;
    ctx.drawImage(photo,PX-(dw-PW)*px,PY-(dh-PH)*py,dw,dh);
  }else{
    const g=ctx.createLinearGradient(0,0,W,SEAM);g.addColorStop(0,'#2b3a55');g.addColorStop(1,'#6b2a2a');
    ctx.fillStyle=g;ctx.fillRect(PX,PY,PW,PH);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 44px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('ছবি বাছুন',W/2,SEAM/2-60);
  }
  const cap=$('caption').value.trim();
  if(cap){
    const g=ctx.createLinearGradient(0,SEAM-300,0,SEAM);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.85)');
    ctx.fillStyle=g;ctx.fillRect(PX,SEAM-300,PW,300);
    ctx.fillStyle='#fff';ctx.font='400 31px '+FONT;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    const lines=wrap(cap,600).slice(0,5);
    const lh=44;let y=SEAM-104-(lines.length-1)*lh;
    lines.forEach(l=>{ctx.fillText(l,60,y);y+=lh});
  }
  ctx.restore();
  // ফ্রেমের ভেতরে খুব হালকা সাদা রেখা
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(PX+9,SEAM-1);ctx.lineTo(PX+9,PY+r+4);ctx.quadraticCurveTo(PX+9,PY+9,PX+r+4,PY+9);
  ctx.lineTo(PX+PW-r-4,PY+9);ctx.quadraticCurveTo(PX+PW-9,PY+9,PX+PW-9,PY+r+4);ctx.lineTo(PX+PW-9,SEAM-1);ctx.stroke();
  ctx.restore();
}

function drawPanel(){
  ctx.fillStyle=PANEL;ctx.fillRect(0,SEAM,W,H-SEAM);
  if(!logoReady)return;
  // লোগো: অর্ধেক ছবিতে, অর্ধেক নিচের অংশে (ঠিক মাঝখানে)
  const lw=240,lh=lw*logo.height/logo.width;
  const padX=28,padY=22,pw=lw+padX*2,ph=lh+padY*2,rr=30;
  const px=(W-pw)/2,py=SEAM-ph/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=22;ctx.shadowOffsetY=6;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.moveTo(px+rr,py);ctx.lineTo(px+pw-rr,py);ctx.quadraticCurveTo(px+pw,py,px+pw,py+rr);
  ctx.lineTo(px+pw,py+ph-rr);ctx.quadraticCurveTo(px+pw,py+ph,px+pw-rr,py+ph);
  ctx.lineTo(px+rr,py+ph);ctx.quadraticCurveTo(px,py+ph,px,py+ph-rr);
  ctx.lineTo(px,py+rr);ctx.quadraticCurveTo(px,py,px+rr,py);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.drawImage(logo,(W-lw)/2,py+padY,lw,lh);
}

const HF="'Noto Sans Bengali','Hind Siliguri',sans-serif";
const QC=['#d6120a','#151515','#0a3fa8','#0a7a3d','#e86a0c','#8c1313','#555555'];

function addRow(text,color){
  const rows=$('rows');if(rows.children.length>=8)return null;
  const d=document.createElement('div');d.className='lr';
  let h='<div class="row"><input type="text" class="tt" placeholder="এখানে লিখুন"><input type="color" class="cc" aria-label="এই লাইনের রং"><button type="button" class="x" aria-label="লাইন মুছুন">✕</button></div>';
  h+='<details class="sub"><summary>এই লাইন সাজান (সাইজ, ডানে-বামে, উপরে-নিচে)</summary><div class="subbody">';
  SL.forEach(a=>{h+='<label>'+a[1]+': <span data-v="'+a[0]+'"></span></label><input type="range" data-k="'+a[0]+'" min="'+a[2]+'" max="'+a[3]+'" value="'+a[4]+'">'});
  h+='<button type="button" class="secondary rst">এই লাইন আগের মতো করুন</button></div></details>';
  d.innerHTML=h;
  const inp=d.querySelector('.tt'),col=d.querySelector('.cc');
  inp.value=text||'';col.value=color||'#d6120a';
  const sync=()=>{SL.forEach(a=>{const r=d.querySelector('input[data-k="'+a[0]+'"]');d.querySelector('[data-v="'+a[0]+'"]').textContent=bn(r.value)+a[5]})};
  d.querySelectorAll('input[type=range]').forEach(r=>r.addEventListener('input',()=>{sync();draw()}));
  d.querySelector('.rst').onclick=()=>{SL.forEach(a=>{d.querySelector('input[data-k="'+a[0]+'"]').value=a[4]});sync();draw()};
  d.querySelector('.x').onclick=()=>{if(focusRow===d)focusRow=null;d.remove();draw()};
  inp.oninput=draw;col.oninput=draw;col.onchange=draw;
  inp.onfocus=()=>{focusRow=d};col.onfocus=()=>{focusRow=d};
  sync();rows.appendChild(d);return d;
}
[['','#d6120a'],['','#151515']].forEach(r=>addRow(r[0],r[1]));
QC.forEach(c=>{
  const b=document.createElement('button');b.type='button';b.className='qd';b.style.background=c;b.setAttribute('aria-label','রং '+c);
  b.onmousedown=e=>e.preventDefault();
  b.onclick=()=>{
    const d=(focusRow&&focusRow.isConnected)?focusRow:$('rows').firstElementChild;
    if(d){d.querySelector('.cc').value=c;draw()}

$('addRow').onclick=()=>{const n=$('rows').children.length;const d=addRow('',QC[n%QC.length]);if(d){d.querySelector('.tt').focus();focusRow=d}draw()};
function getRows(){return [...$('rows').children].map(d=>{const g=k=>parseFloat(d.querySelector('input[data-k="'+k+'"]').value);return {t:d.querySelector('.tt').value.trim(),c:d.querySelector('.cc').value,s:g('s')/100,dx:g('dx'),dy:g('dy')}}).filter(r=>r.t)}

function splitWords(words,k,wf){
  const n=words.length;k=Math.min(k,n);
  if(k<=1)return [words.join(' ')];
  const pre=(a,b)=>wf(words.slice(a,b).join(' '));
  const INF=1e9,dp=[],bk=[];
  for(let j=0;j<=k;j++){dp.push(new Array(n+1).fill(INF));bk.push(new Array(n+1).fill(0))}
  dp[0][0]=0;
  for(let j=1;j<=k;j++)for(let i=j;i<=n;i++)for(let m=j-1;m<i;m++){
    const c=Math.max(dp[j-1][m],pre(m,i));
    if(c<dp[j][i]){dp[j][i]=c;bk[j][i]=m}
  }
  const out=[];let i=n;
  for(let j=k;j>=1;j--){const m=bk[j][i];out.unshift(words.slice(m,i).join(' '));i=m}
  return out;
}

function drawHeadline(){
  const rows=getRows();
  const areaTop=SEAM+88,areaBot=1254,boxW=1000,boxH=areaBot-areaTop,cx=W/2;
  const v=parseInt($('bold').value,10);
  const wgt=Math.max(100,Math.min(900,200+v*60)),extra=Math.max(0,v-10);
  const st=parseInt($('tstretch').value,10)/100,gap=parseInt($('gap').value,10);
  const auto=$('autoSize').checked,equal=$('equal').checked,wrapOn=$('wrapLines').checked;
  $('boldVal').textContent=bn(v);$('tstretchVal').textContent=bn(Math.round(st*100));$('gapVal').textContent=bn(gap);
  $('tsize').disabled=auto;
  ctx.textBaseline='middle';
  if(!rows.length){
    ctx.fillStyle='#9a9a9a';ctx.font='600 54px '+HF;ctx.textAlign='center';
    ctx.fillText('এখানে শিরোনাম আসবে',W/2,(areaTop+areaBot)/2);return;
  }
  const font=s=>wgt+' '+s+'px '+HF;
  ctx.font=font(100);
  const wf=t=>ctx.measureText(t).width;
  const LH=1.05*st+.1,CAP=118;
  const rowGap=gap;
  // প্রতি র‍্যো কতভাগে ভাঙবে তার সব সম্ভাবনা
  const opts=rows.map(r=>{
    const words=r.t.split(/\s+/).filter(Boolean);
    const maxK=(auto&&wrapOn)?Math.min(3,words.length):1;
    const a=[];
    for(let k=1;k<=maxK;k++){
      const ls=splitWords(words,k,wf);
      a.push({ls,ws:ls.map(wf)});
    }
    return a;
  });
  function evalCombo(pick){
    const lines=[];
    pick.forEach((k,ri)=>opts[ri][k].ls.forEach((t,j)=>lines.push({t,w:opts[ri][k].ws[j],ri})));
    const n=lines.length,rowsN=rows.length;
    const gaps=(rowsN-1)*rowGap;
    let sizes;
    if(auto){
      if(equal){const s=Math.min(CAP,...lines.map(l=>boxW/(l.w/100)));sizes=lines.map(()=>s)}
      else sizes=lines.map(l=>Math.min(CAP,boxW/(l.w/100)));
    }else{const s=parseInt($('tsize').value,10);sizes=lines.map(()=>s)}
    let f=Math.min(1,...lines.map((l,i)=>boxW/(l.w*sizes[i]/100)));
    const need=sizes.reduce((a,s)=>a+s*LH,0);
    f=Math.min(f,(boxH-gaps)/need);
    return {lines,sizes,f,score:Math.min(...sizes)*f};
  }
  let best=null;
  const pick=[];
  (function rec(i,cnt){
    if(cnt>5)return;
    if(i===rows.length){
      const r=evalCombo(pick);
      if(!best||r.score>best.score+0.5)best=r;
      return;
    }
    for(let k=0;k<opts[i].length;k++){pick[i]=k;rec(i+1,cnt+k+1)}
  })(0,0);
  if(!best){pick.fill(0);best=evalCombo(rows.map(()=>0))}
  const {lines,sizes,f}=best;
  const shown=Math.round(sizes[0]*f);
  if(auto)$('tsize').value=Math.max(30,Math.min(170,shown));
  $('tsizeVal').textContent=bn(shown);
  const fs=lines.map((l,i)=>sizes[i]*f*rows[l.ri].s);
  let total=0;
  lines.forEach((l,i)=>{total+=fs[i]*LH;if(i&&l.ri!==lines[i-1].ri)total+=rowGap*f});
  let y=areaTop+(boxH-total)/2;
  lines.forEach((l,i)=>{
    if(i&&l.ri!==lines[i-1].ri)y+=rowGap*f;
    const r=rows[l.ri],size=fs[i],lh=size*LH,cy=y+lh/2+r.dy;
    ctx.font=font(size);
    const tw=ctx.measureText(l.t).width;
    ctx.save();
    ctx.translate(cx+r.dx-tw/2,cy);ctx.scale(1,st);
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=r.c;ctx.font=font(size);
    if(extra>0){ctx.strokeStyle=r.c;ctx.lineJoin='round';ctx.lineWidth=size*.012*extra;ctx.strokeText(l.t,0,0)}
    ctx.fillText(l.t,0,0);
    ctx.restore();
    y+=lh;
  });
}

function drawFooter(){
  ctx.fillStyle=FOOT;ctx.fillRect(0,1268,W,H-1268);
  const cat=$('cat').value.trim();
  const date=$('useDate').checked?fmtDate($('date').value):'';
  ctx.fillStyle='#2a2a2a';ctx.textBaseline='middle';
  const cy=1268+(H-1268)/2+2;
  ctx.font='500 37px '+FONT;ctx.textAlign='left';
  let x=60;
  if(cat){ctx.fillText(cat,x,cy);x+=ctx.measureText(cat).width}
  if(cat&&date){x+=18;ctx.fillRect(x,cy-24,2,48);x+=20}
  if(date){ctx.fillText(date,x,cy)}
  const right=$('rightTxt').value.trim();
  if(right){ctx.textAlign='right';ctx.font='600 37px '+FONT;ctx.fillText(right,W-60,cy)}
}

function draw(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    ctx.clearRect(0,0,W,H);
    drawPhoto();drawPanel();drawHeadline();drawFooter();
  });
}

// ---- storage (per-device conveniences) ----
const KEYS=['cat','rightTxt','bold','tstretch','gap','tsize'];
const CHKS=['useDate','wrapLines','equal','autoSize'];
function loadPrefs(){
  try{
    const s=JSON.parse(localStorage.getItem('bt-card-prefs3')||'{}');
    KEYS.forEach(k=>{if(typeof s[k]==='string'){const el=$(k);if(el.options?[...el.options].some(o=>o.value===s[k]):true)el.value=s[k]}});
    CHKS.forEach(k=>{if(typeof s[k]==='boolean')$(k).checked=s[k]});
  }catch(e){}
}
function savePrefs(){
  try{
    const s={};KEYS.forEach(k=>s[k]=$(k).value);CHKS.forEach(k=>s[k]=$(k).checked);
    localStorage.setItem('bt-card-prefs3',JSON.stringify(s));
  }catch(e){}
}
function ensureFont(){
  if(!document.fonts||!document.fonts.load)return;
  document.fonts.load('600 50px '+HF,'অআকখ').then(draw).catch(()=>{});
}

// ---- events ----
$('date').value=todayStr();
loadPrefs();
['caption','cat','rightTxt','date','zoom','px','py','useDate','wrapLines','autoSize','equal','tsize','tstretch','bold','gap'].forEach(id=>{
  const ev=()=>{savePrefs();draw()};
  $(id).addEventListener('input',ev);
  $(id).addEventListener('change',ev);
});
$('photo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{photo=img;$('photoLbl').textContent='ছবি বদলান';$('zoom').value=100;$('px').value=50;$('py').value=35;draw()};
  img.onerror=()=>{$('msg').textContent='ছবিটি খোলা যায়নি, অন্য ছবি দিন।'};
  img.src=url;
});

function getBlob(){return new Promise(res=>cv.toBlob(res,'image/png'))}
let claudeDl=null,claudeTried=false;
async function dlns(){
  if(claudeTried)return claudeDl;claudeTried=true;
  try{claudeDl=window.claude&&await window.claude.use('downloads')}catch(e){claudeDl=null}
  return claudeDl;
}
dlns();

function showFallback(blob,note){
  $('outImg').src=URL.createObjectURL(blob);
  $('fallback').style.display='block';
  if(note)$('msg').textContent=note;
  setTimeout(()=>$('fallback').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function anchorDownload(blob,name){
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove()},1500);
    return true;
  }catch(e){return false}
}
$('save').addEventListener('click',async()=>{
  $('msg').textContent='ছবি তৈরি হচ্ছে...';
  draw();
  await new Promise(r=>setTimeout(r,120));
  const blob=await getBlob();
  if(!blob){$('msg').textContent='ছবি তৈরি করা যায়নি, আবার চেষ্টা করুন।';return}
  const name='bangladesh-today-'+Date.now()+'.png';
  // সবসময় ছবিটা নিচে দেখাই, যাতে কোনোভাবেই সেভ আটকে না যায়
  showFallback(blob);
  const dl=await dlns();
  if(dl){
    try{
      await dl.save({filename:name,data:blob});
      $('msg').textContent='সেভ হয়েছে। না পেলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return;
    }catch(e){
      if(e&&e.code==='declined'){$('msg').textContent='সেভ বাতিল করা হয়েছে। চাইলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return}
    }
  }
  if(anchorDownload(blob,name)){
    $('msg').textContent='ডাউনলোড শুরু হয়েছে। না হলে নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।';
  }else{
    $('msg').textContent='নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।';
  }
});

(async()=>{
  try{
    const b=await getBlob();
    const f=new File([b],'card.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))$('share').style.display='block';

});
