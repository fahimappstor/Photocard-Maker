<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangladesh Today ফটোকার্ড মেকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--card:#ffffff;--ink:#1b1b1b;--sub:#666;--line:#dcdcd8;--accent:#d6120a;--accent-ink:#fff;--field:#fafaf9;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
}
:root[data-theme="dark"]{--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 2px 12px;font-weight:700;text-align:center}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:0;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.12)}
canvas{display:block;margin:0 auto;width:100%;height:auto;aspect-ratio:1/1;border-radius:8px;background:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
label:first-child{margin-top:0}
.hint{color:var(--sub);font-size:13px;font-weight:400}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
button,.filebtn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;width:100%;display:block;text-align:center}
.filebtn{background:var(--field);color:var(--ink);border:1px dashed var(--sub)}
.primary{background:var(--accent);color:var(--accent-ink);margin-top:14px;font-size:17px}
.secondary{background:var(--field);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.acc{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.acc summary{list-style:none;cursor:pointer;font-weight:700;font-size:14px;padding:8px 2px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";color:var(--accent);font-size:18px}
.acc[open] summary::after{content:"－"}
.accbody{padding-bottom:6px}
.qc{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.qd{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input[type=text]{flex:1;min-width:0}
.row input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.row .x{width:36px;padding:8px 0;background:var(--field);color:var(--sub);border:1px solid var(--line);border-radius:8px}
.lr{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--field)}
.lr .row{margin-top:0}
.lr input[type=text]{background:var(--card)}
#msg{margin-top:10px;font-size:14px;color:var(--sub);text-align:center;min-height:20px}
#fallback{display:none;margin-top:12px}
#fallback img{width:100%;border-radius:8px;border:1px solid var(--line)}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
  <h1>Bangladesh Today ফটোকার্ড মেকার</h1>

  <div class="preview"><canvas id="cv" width="1080" height="1080" aria-label="ফটোকার্ডের প্রিভিউ"></canvas></div>

  <div class="panel">
    <label class="filebtn" for="photo" id="photoLbl">ছবি বাছুন</label>
    <input type="file" id="photo" accept="image/*">
    <details class="acc">
      <summary>ছবি বড়-ছোট / পজিশন অ্যাডজাস্ট</summary>
      <div class="accbody">
        <label>জুম করুন</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
        <label>ডানে-বামে</label>
        <input type="range" id="px" min="0" max="100" value="50">
        <label>উপরে-নিচে</label>
        <input type="range" id="py" min="0" max="100" value="35">
      </div>
    </details>
  </div>

  <div class="panel">
    <label>শিরোনাম <span class="hint">(প্রতি লাইনের লেখা ও রং আলাদা করুন)</span></label>
    <div class="qc" id="qc" aria-label="রং নির্বাচন"></div>
    <div id="rows"></div>
    <button class="secondary" id="addRow" type="button">＋ নতুন লাইন যোগ করুন</button>
    
    <details class="acc">
      <summary>লেখা সাজানোর অপশন (সাইজ, ফন্ট স্পেসিং)</summary>
      <div class="accbody">
        <label for="bold">লেখা মোটা-চিকন: <span id="boldVal">৮</span></label>
        <input type="range" id="bold" min="1" max="12" value="8">
        <div class="check"><input type="checkbox" id="autoSize" checked><label for="autoSize" style="margin:0">অটো টেক্সট সাইজ</label></div>
        <label for="tsize">ম্যানুয়াল সাইজ: <span id="tsizeVal">৬৮</span></label>
        <input type="range" id="tsize" min="30" max="120" value="68" disabled>
        <label for="gap">লাইনের মাঝের ফাঁক: <span id="gapVal">১২</span></label>
        <input type="range" id="gap" min="0" max="50" value="12">
      </div>
    </details>
  </div>

  <div class="panel">
    <details class="acc" style="margin-top:0" open>
      <summary>তারিখ, ব্যাজ ও ওয়েবসাইট তথ্য</summary>
      <div class="accbody">
        <div class="check"><input type="checkbox" id="useDate" checked><label for="useDate" style="margin:0">তারিখ দেখাও</label></div>
        <input type="date" id="date">

        <label for="badgeTxt">মাঝের বাটন / ব্যাজ টেক্সট</label>
        <input type="text" id="badgeTxt" value="নিউজ লিংক কমেন্টে">

        <label for="rightTxt">ডানপাশের ওয়েবসাইট / হ্যান্ডেল</label>
        <input type="text" id="rightTxt" value="bangladeshtoday.com">
      </div>
    </details>
  </div>

  <button class="primary" id="save">ফটোকার্ড ডাউনলোড করুন</button>
  <button class="secondary" id="share" style="display:none">শেয়ার করুন</button>
  <div id="msg" role="status"></div>
  <div id="fallback"><p style="font-weight:700;margin:0 0 8px">তৈরি ফটোকার্ড <span class="hint">(সেভ না হলে ছবিতে চেপে ধরে ডাউনলোড দিন)</span></p><img id="outImg" alt="ফটোকার্ড"></div>
</main>

<script>
// Bangladesh Today Vector SVG Data URL
const LOGO_SVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500"><circle cx="250" cy="250" r="240" fill="%23ffffff" stroke="%23e5e5e5" stroke-width="8"/><text x="250" y="225" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-weight="800" font-size="64" fill="%23111111" text-anchor="middle">Bangladesh</text><rect x="110" y="255" width="280" height="95" rx="28" fill="%23d6120a"/><text x="250" y="325" font-family="'Noto Sans Bengali', system-ui, sans-serif" font-weight="800" font-size="66" fill="%23ffffff" text-anchor="middle">Today</text></svg>`;

const W=1080, H=1080;
const FONT="'Noto Sans Bengali','Hind Siliguri',sans-serif";
const MONTHS=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let photo=null, logo=new Image(), logoReady=false, raf=0;

logo.onload=()=>{logoReady=true; draw()};
logo.src=LOGO_SVG;

function bn(n){return String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d])}
function fmtDate(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return '';
  return bn(parseInt(m[3],10))+' '+MONTHS[parseInt(m[2],10)-1]+' '+bn(m[1]);
}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}

function drawPhoto(){
  const margin=36, photoH=520;
  const pw=W-2*margin, ph=photoH, px=margin, py=margin;
  
  // ব্যাকগ্রাউন্ড
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  // ফটো কন্টেইনার উইথ শেডো
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.08)';
  ctx.shadowBlur=12;
  ctx.shadowOffsetY=4;
  
  const r=24;
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.lineTo(px+pw-r, py); ctx.quadraticCurveTo(px+pw, py, px+pw, py+r);
  ctx.lineTo(px+pw, py+ph-r); ctx.quadraticCurveTo(px+pw, py+ph, px+pw-r, py+ph);
  ctx.lineTo(px+r, py+ph); ctx.quadraticCurveTo(px, py+ph, px, py+ph-r);
  ctx.lineTo(px, py+r); ctx.quadraticCurveTo(px, py, px+r, py);
  ctx.closePath();
  ctx.fillStyle='#e8e8e8';
  ctx.fill();
  ctx.restore();

  // ছবি ক্লিপিং ও ড্র
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(px+r, py);
  ctx.lineTo(px+pw-r, py); ctx.quadraticCurveTo(px+pw, py, px+pw, py+r);
  ctx.lineTo(px+pw, py+ph-r); ctx.quadraticCurveTo(px+pw, py+ph, px+pw-r, py+ph);
  ctx.lineTo(px+r, py+ph); ctx.quadraticCurveTo(px, py+ph, px, py+ph-r);
  ctx.lineTo(px, py+r); ctx.quadraticCurveTo(px, py, px+r, py);
  ctx.closePath();
  ctx.clip();

  if(photo){
    const z=$('zoom').value/100, xOff=$('px').value/100, yOff=$('py').value/100;
    const s=Math.max(pw/photo.width, ph/photo.height)*z;
    const dw=photo.width*s, dh=photo.height*s;
    ctx.drawImage(photo, px-(dw-pw)*xOff, py-(dh-ph)*yOff, dw, dh);
  }else{
    ctx.fillStyle='#3b4a5a';
    ctx.fillRect(px,py,pw,ph);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.font='700 42px '+FONT;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('এখানে ছবি বেছে নিন', W/2, py+ph/2);
  }
  ctx.restore();

  // হালকা বর্ডার
  ctx.strokeStyle='#d8d8d8';
  ctx.lineWidth=2;
  ctx.stroke();

  // লোগো বসানো (ছবি ও হেডলাইনের মাঝে ওভারল্যাপ)
  if(logoReady){
    const lSize=180;
    const lx=W/2 - lSize/2;
    const ly=py+ph - lSize/2;
    
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.12)';
    ctx.shadowBlur=16;
    ctx.shadowOffsetY=4;
    ctx.drawImage(logo, lx, ly, lSize, lSize);
    ctx.restore();
  }
}

const QC=['#111111','#d6120a','#0055b8','#0a7a3d','#e86a0c','#666666'];
function addRow(text,color){
  const rows=$('rows'); if(rows.children.length>=5)return;
  const d=document.createElement('div'); d.className='lr';
  d.innerHTML=`<div class="row">
    <input type="text" class="tt" placeholder="শিরোনাম লিখুন" value="${text||''}">
    <input type="color" class="cc" value="${color||'#111111'}">
    <button type="button" class="x">✕</button>
  </div>`;
  d.querySelector('.tt').oninput=draw;
  d.querySelector('.cc').oninput=draw;
  d.querySelector('.x').onclick=()=>{d.remove();draw()};
  rows.appendChild(d);
}

// ডিফল্ট দুই লাইন
addRow('‘পাঠাও’ থেকে গ্রাহকদের তথ্য চুরি','#111111');
addRow('যেসব ঝুঁকি তৈরি হতে পারে','#d6120a');

QC.forEach(c=>{
  const b=document.createElement('button'); b.type='button'; b.className='qd'; b.style.background=c;
  b.onclick=()=>{
    const last=$('rows').lastElementChild;
    if(last){last.querySelector('.cc').value=c; draw();}
  };
  $('qc').appendChild(b);
});

$('addRow').onclick=()=>{addRow('','#d6120a'); draw();};

function getRows(){
  return [...$('rows').children].map(d=>({
    t: d.querySelector('.tt').value.trim(),
    c: d.querySelector('.cc').value
  })).filter(r=>r.t);
}

function drawHeadline(){
  const rows=getRows();
  const areaTop=660, areaBot=960, cx=W/2;
  const v=parseInt($('bold').value,10);
  const wgt=Math.max(600, Math.min(900, 400 + v*40));
  const gap=parseInt($('gap').value,10);
  const auto=$('autoSize').checked;
  
  $('boldVal').textContent=bn(v);
  $('gapVal').textContent=bn(gap);$('tsize').disabled=auto;

  if(!rows.length) return;

  let fontSize=auto?68:parseInt($('tsize').value,10);
  ctx.font=`${wgt} ${fontSize}px ${FONT}`;

  if(auto){
    let maxW=0;
    rows.forEach(r=>{
      const w=ctx.measureText(r.t).width;
      if(w>maxW) maxW=w;
    });
    if(maxW > 980){
      fontSize=Math.max(38, Math.floor(fontSize * (980 / maxW)));
    }
  }
  $('tsizeVal').textContent=bn(fontSize);

  const lh=fontSize * 1.35;
  const totalH=rows.length * lh + (rows.length-1)*gap;
  let y=areaTop + (areaBot - areaTop - totalH)/2 + fontSize/2;

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  rows.forEach(r=>{
    ctx.font=`${wgt} ${fontSize}px ${FONT}`;
    ctx.fillStyle=r.c;
    ctx.fillText(r.t, cx, y);
    y+=lh + gap;
  });
}

function drawFooter(){
  const yLine=985;
  
  // ডিভাইডার লাইন
  ctx.strokeStyle='#dcdcd8';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(36, yLine);
  ctx.lineTo(W-36, yLine);
  ctx.stroke();

  const footerY=yLine + 48;

  // বামে: তারিখ
  if($('useDate').checked){
    const dStr=fmtDate($('date').value);
    ctx.font='700 28px '+FONT;
    ctx.fillStyle='#222222';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText(dStr, 40, footerY);
  }

  // মাঝখানে: ব্যাজ বাটন
  const badge=$('badgeTxt').value.trim();
  if(badge){
    ctx.font='700 24px '+FONT;
    const tw=ctx.measureText(badge).width;
    const bw=tw + 36, bh=42;
    const bx=W/2 - bw/2, by=footerY - bh/2;

    ctx.fillStyle='#d6120a';
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 10);
    ctx.fill();

    ctx.fillStyle='#ffffff';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(badge, W/2, footerY+1);
  }

  // ডানে: ওয়েবসাইট লিংক
  const right=$('rightTxt').value.trim();
  if(right){
    ctx.font='600 28px '+FONT;
    ctx.fillStyle='#333333';
    ctx.textAlign='right';
    ctx.textBaseline='middle';
    ctx.fillText(right, W-40, footerY);
  }
}

function draw(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    ctx.clearRect(0,0,W,H);
    drawPhoto();
    drawHeadline();
    drawFooter();
  });
}

// ইভেন্ট লিসেনার
$('date').value=todayStr();

['zoom','px','py','useDate','date','badgeTxt','rightTxt','autoSize','tsize','bold','gap'].forEach(id=>{
  $(id).addEventListener('input', draw);$(id).addEventListener('change', draw);
});

$('photo').addEventListener('change', e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    photo=img;
    $('photoLbl').textContent='ছবি বদলান';
    $('zoom').value=100; $('px').value=50; $('py').value=35;
    draw();
  };
  img.src=url;
});

$('save').addEventListener('click', async()=>{$('msg').textContent='ফটোকার্ড তৈরি হচ্ছে...';
  draw();
  setTimeout(()=>{
    cv.toBlob(blob=>{
      if(!blob){$('msg').textContent='সমস্যা হয়েছে, আবার চেষ্টা করুন।';return;}
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='bangladesh-today-card.png';
      a.click();
      $('outImg').src=a.href;
      $('fallback').style.display='block';$('msg').textContent='ডাউনলোড সম্পন্ন হয়েছে!';
    },'image/png');
  },100);
});

draw();
</script>
</body>
      </html>
