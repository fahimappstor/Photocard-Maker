<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangladesh Today ফটোকার্ড মেকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@100..900&family=Anek+Bangla:wght@100..800&family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--card:#ffffff;--ink:#1b1b1b;--sub:#666;--line:#dcdcd8;--accent:#e3180a;--accent-ink:#fff;--field:#fafaf9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
}
:root[data-theme="dark"]{--bg:#111112;--card:#1b1b1d;--ink:#f1f1ef;--sub:#a0a0a0;--line:#333336;--field:#232326;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush',system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:20px;margin:6px 2px 12px;font-weight:700}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;position:sticky;top:0;z-index:20;box-shadow:0 6px 16px rgba(0,0,0,.14)}
canvas{display:block;margin:0 auto;width:auto;max-width:100%;height:min(42vh,calc(100vw - 56px));aspect-ratio:1/1;border-radius:8px;background:#ddd}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
label:first-child{margin-top:0}
.hint{color:var(--sub);font-size:13px;font-weight:400}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.row label{margin:0;flex:1}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
button,.filebtn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;width:100%;display:block;text-align:center}
.filebtn{background:var(--field);color:var(--ink);border:1px dashed var(--sub)}
.primary{background:var(--accent);color:var(--accent-ink);margin-top:14px;font-size:18px}
.secondary{background:var(--field);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.acc{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.acc summary{list-style:none;cursor:pointer;font-weight:700;font-size:15px;padding:10px 2px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"＋";color:var(--accent);font-size:20px;line-height:1}
.acc[open] summary::after{content:"－"}
.accbody{padding-bottom:6px}
textarea{min-height:70px}
.qc{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
.qd{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input[type=text]{flex:1;min-width:0}
.row input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);flex:none;cursor:pointer}
.row .x{width:38px;flex:none;padding:10px 0;background:var(--field);color:var(--sub);border:1px solid var(--line);border-radius:10px}
.lr{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--field)}
.lr .row{margin-top:0}
.lr input[type=text]{background:var(--card)}
.sub{margin-top:8px}
.sub summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);padding:6px 0;list-style:none}
.sub summary::-webkit-details-marker{display:none}
.sub label{font-size:14px;margin:8px 0 2px}
.sub .secondary{margin-top:10px;padding:9px 12px;font-size:14px;background:var(--card)}
#msg{margin-top:10px;font-size:14px;color:var(--sub);min-height:20px}
#fallback{display:none;margin-top:12px}
#fallback img{width:100%;border-radius:8px}
input[type=file]{display:none}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}.two button{margin-top:8px;padding:10px 8px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=color]{width:100%;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer}
#headline{font-size:19px;line-height:1.45}
#info{margin-top:8px;font-weight:600;color:var(--accent);min-height:20px}
.actions{position:sticky;bottom:0;z-index:30;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:10px;box-shadow:0 -10px 14px -8px var(--bg)}
.actions .two button{margin-top:0;padding:13px 8px}
.actions #msg{margin-top:6px;min-height:0;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Bangladesh Today ফটোকার্ড</h1>

  <div class="preview"><canvas id="cv" width="1080" height="1080" aria-label="ফটোকার্ডের প্রিভিউ"></canvas></div>

  <div class="panel">
    <label class="filebtn" for="photo" id="photoLbl">ছবি বাছুন</label>
    <input type="file" id="photo" accept="image/*">
    <details class="acc">
      <summary>ছবি বড়-ছোট / সরানো</summary>
      <div class="accbody">
        <label>ছবি বড়-ছোট করুন</label>
        <input type="range" id="zoom" min="100" max="300" value="100">
        <label>ছবি ডানে-বামে</label>
        <input type="range" id="px" min="0" max="100" value="50">
        <label>ছবি উপরে-নিচে</label>
        <input type="range" id="py" min="0" max="100" value="35">
      </div>
    </details>
  </div>

  <div class="panel">
    <label for="headline">শিরোনাম <span class="hint">(পুরোটা একসাথে লিখুন, লাইন নিজে ব্যালেন্স হবে)</span></label>
    <textarea id="headline" placeholder="এখানে পুরো শিরোনাম লিখুন বা পেস্ট করুন" style="min-height:104px"></textarea>
    <div class="two"><button class="secondary" id="pasteBtn" type="button">📋 পেস্ট</button><button class="secondary" id="clearBtn" type="button">✕ লেখা মুছুন</button></div>
    <div id="info"></div>
    <div class="hint">নিজের মতো লাইন ভাঙতে Enter চাপুন। তখন অটো ব্যালেন্স বন্ধ হয়ে আপনার ভাঙা লাইনই থাকবে।</div>

    <div class="grid2">
      <div><label for="nlines">লাইন সংখ্যা</label>
        <select id="nlines"><option value="0">অটো (সেরা)</option><option value="1">১ লাইন</option><option value="2">২ লাইন</option><option value="3">৩ লাইন</option><option value="4">৪ লাইন</option></select></div>
      <div><label for="nred">শেষের কয়টা লাইন রঙিন</label>
        <select id="nred"><option value="1">শেষ ১ লাইন</option><option value="2">শেষ ২ লাইন</option><option value="0">কোনোটাই না</option><option value="99">সব লাইন</option></select></div>
    </div>
    <label>রঙিন লাইনের রং <span class="hint">(চাপ দিয়ে বাছুন)</span></label>
    <div class="qc" id="qc" aria-label="দ্রুত রং"></div>
    <div class="grid2">
      <div><label for="cAcc" style="margin-top:6px">রঙিন লাইনের রং</label><input type="color" id="cAcc" value="#d4181f"></div>
      <div><label for="cMain" style="margin-top:6px">বাকি লাইনের রং</label><input type="color" id="cMain" value="#151515"></div>
    </div>

    <details class="acc">
      <summary>লেখার সেটিং (ফন্ট, সাইজ, মোটা-চিকন, ফাঁক)</summary>
      <div class="accbody">
        <label for="hfont">ফন্ট</label>
        <select id="hfont"><option value="noto">নোটো সান্স বাংলা</option><option value="hind">হিন্দ শিলিগুড়ি</option><option value="anek">আনেক বাংলা</option><option value="mukta">মুক্তা</option></select>
        <label for="hscale">লেখা বড়-ছোট: <span id="hscaleVal">১০০</span>%</label>
        <input type="range" id="hscale" min="60" max="140" value="100">
        <label for="hdy">লেখা উপরে-নিচে: <span id="hdyVal">০</span></label>
        <input type="range" id="hdy" min="-80" max="80" value="0">
        <label for="bold">লেখা মোটা-চিকন: <span id="boldVal">৭</span> <span class="hint">(১ = চিকন, ১২ = সবচেয়ে মোটা)</span></label>
        <input type="range" id="bold" min="1" max="12" value="7">
        <label for="gap">লাইনের মাঝের ফাঁক: <span id="gapVal">৬</span></label>
        <input type="range" id="gap" min="0" max="60" value="6">
        <label for="tstretch">লেখা লম্বা করুন: <span id="tstretchVal">১০০</span>% <span class="hint">(১০০ = স্বাভাবিক)</span></label>
        <input type="range" id="tstretch" min="100" max="125" value="100">
      </div>
    </details>
  </div>

  <div class="panel">
    <details class="acc" style="margin-top:0">
      <summary>ক্যাপশন, ক্যাটাগরি, তারিখ, ডান পাশের লেখা</summary>
      <div class="accbody">
        <label for="caption">ছবির ক্যাপশন <span class="hint">(ঐচ্ছিক)</span></label>
        <textarea id="caption" placeholder="ছবির নিচে ছোট করে যা লিখতে চান" style="min-height:64px"></textarea>

        <label for="cat">ক্যাটাগরি <span class="hint">(ঐচ্ছিক)</span></label>
        <input type="text" id="cat" value="" placeholder="খালি রাখলে শুধু তারিখ দেখাবে">

        <div class="check"><input type="checkbox" id="useDate" checked><label for="useDate" style="margin:0">তারিখ দেখাও</label></div>
        <input type="date" id="date">

        <label for="rightTxt">নিচে ডান পাশের লেখা (ওয়েবসাইট) <span class="hint">(ঐচ্ছিক)</span></label>
        <input type="text" id="rightTxt" value="www.bangladeshtoday.com" placeholder="খালি রাখলে কিছু দেখাবে না">
      </div>
    </details>
  </div>

  <div class="actions">
    <div class="two"><button class="primary" id="save" style="flex:2">ফটোকার্ড সেভ করুন</button><button class="secondary" id="share" style="display:none">শেয়ার</button><button class="secondary" id="reset" type="button">নতুন কার্ড</button></div>
    <div id="msg" role="status"></div>
  </div>
  <div id="fallback"><p style="font-weight:700;margin:0 0 8px">তৈরি ফটোকার্ড <span class="hint">(সেভ না হলে ছবিতে চেপে ধরে "ছবি সংরক্ষণ" দিন)</span></p><img id="outImg" alt="তৈরি ফটোকার্ড"></div>
</main>

function bn(n){return String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d])}
function fmtDate(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');if(!m)return '';
  return bn(m[3])+' '+MONTHS[parseInt(m[2],10)-1]+' '+bn(m[1]);
}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}

function wrap(text,maxW){
  const out=[];
  text.split('\n').forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){return}
    let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(ctx.measureText(t).width<=maxW||!line){line=t}else{out.push(line);line=w}
    });
    out.push(line);
  });
  return out;
}

function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function dots(x0,y0,cols,rows,step,fade){
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const k=fade(c,r,cols,rows);if(k<=0)continue;
    ctx.fillStyle='rgba(120,120,128,'+(0.17*k).toFixed(3)+')';
    ctx.beginPath();ctx.arc(x0+c*step,y0+r*step,3.6,0,7);ctx.fill();
  }
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#e1e1e3');g.addColorStop(.55,'#ececee');g.addColorStop(1,'#f3f3f3');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W/2,880,0,W/2,880,640);
  rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.62,'rgba(255,255,255,.96)');rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,SEAM-20,W,H-SEAM+20);
  // হালকা ডট প্যাটার্ন (ডানে-উপরে ও বামে-নিচে)
  dots(1046,26,2,12,24,(c,r,cs,rs)=>1-r/rs);
  dots(1000,26,2,1,24,()=>0.6);
  dots(30,655,6,15,26,(c,r,cs,rs)=>(1-c/cs)*(1-r/rs*0.7));
}
function drawPhoto(){
  const PX=40,PY=40,PW=1000,PH=SEAM-40;
  // সাদা বর্ডারসহ গোল কোণার ফটো কার্ড
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=22;ctx.shadowOffsetY=5;
  ctx.fillStyle='#ffffff';rrect(ctx,PX,PY,PW,PH,30);ctx.fill();
  ctx.restore();
  const B=5,IX=PX+B,IY=PY+B,IW=PW-2*B,IH=PH-2*B;
  ctx.save();
  rrect(ctx,IX,IY,IW,IH,25);ctx.clip();
  if(photo){
    const z=$('zoom').value/100,px=$('px').value/100,py=$('py').value/100;
    const s=Math.max(IW/photo.width,IH/photo.height)*z;
    const dw=photo.width*s,dh=photo.height*s;
    ctx.drawImage(photo,IX-(dw-IW)*px,IY-(dh-IH)*py,dw,dh);
  }else{
    const g=ctx.createLinearGradient(0,0,W,SEAM);g.addColorStop(0,'#2b3a55');g.addColorStop(1,'#6b2a2a');
    ctx.fillStyle=g;ctx.fillRect(IX,IY,IW,IH);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 44px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('ছবি বাছুন',W/2,SEAM/2-40);
  }
  const cap=$('caption').value.trim();
  if(cap){
    const g=ctx.createLinearGradient(0,SEAM-260,0,SEAM);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.85)');
    ctx.fillStyle=g;ctx.fillRect(IX,SEAM-260,IW,260);
    ctx.fillStyle='#fff';ctx.font='400 29px '+FONT;ctx.textAlign='left';ctx.textBaseline='alphabetic';
    const lines=wrap(cap,560).slice(0,4);
    const lh=40;let y=SEAM-112-(lines.length-1)*lh;
    lines.forEach(l=>{ctx.fillText(l,76,y);y+=lh});
  }
  ctx.restore();
}

function drawLogo(){
  if(!logoReady)return;
  // লোগো: ফটো কার্ড আর নিচের অংশের ঠিক মাঝ বরাবর, অর্ধেক ছবিতে অর্ধেক নিচে
  const lw=300,lh=lw*logo.height/logo.width;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=14;ctx.shadowOffsetY=3;
  ctx.drawImage(logo,(W-lw)/2,SEAM-lh/2,lw,lh);
  ctx.restore();
}

// লাইন ভাঙার সেরা উপায় খোঁজা (ব্যালেন্সড)
function bestSplit(words,ww,sp,k){
  const n=words.length;k=Math.min(k,n);
  if(k<=1)return {k:1,lines:[words.join(' ')],maxW:ww.reduce((a,b)=>a+b,0)+(n-1)*sp};
  const P=[0];for(let i=0;i<n;i++)P.push(P[i]+ww[i]);
  const wid=(a,b)=>P[b]-P[a]+(b-a-1)*sp;
  let best=null;
  const br=[];
  const evalS=()=>{
    const b=[0,...br,n],ws=[];
    for(let i=0;i<b.length-1;i++)ws.push(wid(b[i],b[i+1]));
    const maxW=Math.max(...ws),mean=ws.reduce((a,c)=>a+c,0)/ws.length;
    const dev=Math.sqrt(ws.reduce((a,c)=>a+(c-mean)*(c-mean),0)/ws.length);
    let cost=maxW+0.9*dev;
    for(let i=1;i<b.length-1;i++){
      const lw=words[b[i]-1];
      if(/[,:;।?!]$|[”’"')\]]$/.test(lw))cost-=0.17*maxW;
      else if([...lw].length<=2)cost+=0.06*maxW;
    }
    if(ws[ws.length-1]<0.3*maxW)cost+=0.08*maxW;
    if(!best||cost<best.cost)best={cost,maxW,b:b.slice()};
  };
  (function rec(start,left){
    if(left===0){evalS();return}
    for(let i=start;i<=n-left;i++){br.push(i);rec(i+1,left-1);br.pop()}
  })(1,k-1);
  const lines=[];
  for(let i=0;i<best.b.length-1;i++)lines.push(words.slice(best.b[i],best.b[i+1]).join(' '));
  return {k,lines,maxW:best.maxW};
}

function drawHeadline(){
  const raw=$('headline').value.replace(/\r/g,'');
  const S=$('hscale').value/100,st=$('tstretch').value/100,gap=parseInt($('gap').value,10),dyo=parseInt($('hdy').value,10);
  const v=parseInt($('bold').value,10),fam=HFONTS[$('hfont').value]||HFONTS.noto;
  const wgt=Math.max(100,Math.min(900,200+v*60)),extra=Math.max(0,v-10);
  $('boldVal').textContent=bn(v);$('tstretchVal').textContent=bn(Math.round(st*100));$('gapVal').textContent=bn(gap);
  $('hscaleVal').textContent=bn(Math.round(S*100));$('hdyVal').textContent=bn(dyo);
  const areaTop=SEAM+66,areaBot=968,boxW=960,boxH=areaBot-areaTop,cx=W/2;
  ctx.textBaseline='middle';
  if(!raw.trim()){
    ctx.fillStyle='#9a9a9a';ctx.font='600 54px '+HF;ctx.textAlign='center';
    ctx.fillText('এখানে শিরোনাম আসবে',W/2,(areaTop+areaBot)/2);
    $('info').textContent='';return;
  }
  const LH=1.04*st+.06,CAP=120*S,TARGET=84*S;
  ctx.font=wgt+' 100px '+fam;
  const sp=ctx.measureText(' ').width;
  const fitSize=(n,maxW)=>Math.min(CAP,boxW/(maxW/100),(boxH-(n-1)*gap)/(n*LH));
  let lines,size,mode;
  if(raw.includes('\n')){
    lines=raw.split('\n').map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean);
    const mw=Math.max(...lines.map(s=>ctx.measureText(s).width));
    size=fitSize(lines.length,mw);mode='নিজের লাইন';
  }else{
    const words=raw.trim().split(/\s+/).filter(Boolean);
    const ww=words.map(w=>ctx.measureText(w).width);
    const forced=parseInt($('nlines').value,10);
    const kmax=Math.min(4,words.length);
    let best=null;
    for(let k=(forced||1);k<=(forced?Math.min(forced,words.length):kmax);k++){
      const r=bestSplit(words,ww,sp,k);
      const sz=fitSize(r.lines.length,r.maxW);
      const eff=Math.min(sz,TARGET);
      if(!best||eff>best.eff*1.03)best={r,sz,eff};
    }
    lines=best.r.lines;size=best.sz;mode='অটো ব্যালেন্স';
  }
  const n=lines.length;
  $('info').textContent=mode+': '+bn(n)+' লাইন, সাইজ '+bn(Math.round(size));
  const nred=parseInt($('nred').value,10),cA=$('cAcc').value,cM=$('cMain').value;
  const pitch=size*LH,total=n*pitch+(n-1)*gap;
  let y=areaTop+(boxH-total)/2+dyo;
  lines.forEach((l,i)=>{
    const red=nred>=99||i>=n-nred;
    const col=red?cA:cM,cy=y+pitch/2;
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(1,st);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=wgt+' '+size+'px '+fam;ctx.fillStyle=col;
    if(extra>0){ctx.strokeStyle=col;ctx.lineJoin='round';ctx.lineWidth=size*.012*extra;ctx.strokeText(l,0,0)}
    ctx.fillText(l,0,0);
    ctx.restore();
    y+=pitch+gap;
  });
}

function drawFooter(){
  // পাতলা বিভাজক রেখা
  ctx.strokeStyle='#a9a9a9';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(40,1010);ctx.lineTo(1040,1010);ctx.stroke();
  const cat=$('cat').value.trim();
  const date=$('useDate').checked?fmtDate($('date').value):'';
  ctx.fillStyle='#161616';ctx.textBaseline='middle';
  const cy=1047;
  ctx.font='700 30px '+FONT;ctx.textAlign='left';
  let x=40;
  if(cat){ctx.fillText(cat,x,cy);x+=ctx.measureText(cat).width}
  if(cat&&date){x+=16;ctx.fillRect(x,cy-17,2,34);x+=18}
  if(date){ctx.fillText(date,x,cy)}
  const right=$('rightTxt').value.trim();
  if(right){ctx.textAlign='right';ctx.fillStyle='#222';ctx.font='400 33px '+SERIF;ctx.fillText(right,1040,cy)}
}
function drawFrame(){
  ctx.strokeStyle=RED;ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,W-3,H-3);
}

function draw(){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    ctx.clearRect(0,0,W,H);
    drawBackground();drawPhoto();drawHeadline();drawFooter();drawLogo();drawFrame();
  });
}

// ---- storage (per-device conveniences) ----
const KEYS=['cat','rightTxt','bold','tstretch','gap','hscale','hdy','hfont','nlines','nred','cMain','cAcc'];
const CHKS=['useDate'];
function loadPrefs(){
  try{
    const s=JSON.parse(localStorage.getItem('bt-card-prefs5')||'{}');
    KEYS.forEach(k=>{if(typeof s[k]==='string'){const el=$(k);if(el.options?[...el.options].some(o=>o.value===s[k]):true)el.value=s[k]}});
    CHKS.forEach(k=>{if(typeof s[k]==='boolean')$(k).checked=s[k]});
  }catch(e){}
}
function savePrefs(){
  try{
    const s={};KEYS.forEach(k=>s[k]=$(k).value);CHKS.forEach(k=>s[k]=$(k).checked);
    localStorage.setItem('bt-card-prefs5',JSON.stringify(s));
  }catch(e){}
}
function ensureFont(){
  if(!document.fonts||!document.fonts.load)return;
  Promise.all(['noto','hind','anek','mukta'].map(k=>document.fonts.load('600 50px '+HFONTS[k],'অআকখ')).concat([document.fonts.load('700 27px '+FONT,'০১২ অক্টোবর')])).then(draw).catch(()=>{});
}

// ---- events ----
$('date').value=todayStr();
loadPrefs();
['headline','caption','cat','rightTxt','date','zoom','px','py','useDate','tstretch','bold','gap','hscale','hdy','hfont','nlines','nred','cMain','cAcc'].forEach(id=>{
  const ev=()=>{savePrefs();draw()};
  $(id).addEventListener('input',ev);
  $(id).addEventListener('change',ev);
});
$('photo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{photo=img;$('photoLbl').textContent='ছবি বদলান';$('zoom').value=100;$('px').value=50;$('py').value=35;draw()};
  img.onerror=()=>{$('msg').textContent='ছবিটি খোলা যায়নি, অন্য ছবি দিন।'};
  img.src=url;
});

function getBlob(){return new Promise(res=>cv.toBlob(res,'image/png'))}
let claudeDl=null,claudeTried=false;
async function dlns(){
  if(claudeTried)return claudeDl;claudeTried=true;
  try{claudeDl=window.claude&&await window.claude.use('downloads')}catch(e){claudeDl=null}
  return claudeDl;
}
dlns();

function showFallback(blob,note){
  $('outImg').src=URL.createObjectURL(blob);
  $('fallback').style.display='block';
  if(note)$('msg').textContent=note;
  setTimeout(()=>$('fallback').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function anchorDownload(blob,name){
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove()},1500);
    return true;
  }catch(e){return false}
}
$('save').addEventListener('click',async()=>{
  $('msg').textContent='ছবি তৈরি হচ্ছে...';
  draw();
  await new Promise(r=>setTimeout(r,120));
  const blob=await getBlob();
  if(!blob){$('msg').textContent='ছবি তৈরি করা যায়নি, আবার চেষ্টা করুন।';return}
  const name='bangladesh-today-'+Date.now()+'.png';
  // সবসময় ছবিটা নিচে দেখাই, যাতে কোনোভাবেই সেভ আটকে না যায়
  showFallback(blob);
  const dl=await dlns();
  if(dl){
    try{
      await dl.save({filename:name,data:blob});
      $('msg').textContent='সেভ হয়েছে। না পেলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return;
    }catch(e){
      if(e&&e.code==='declined'){$('msg').textContent='সেভ বাতিল করা হয়েছে। চাইলে নিচের ছবি চেপে ধরে সংরক্ষণ করুন।';return}
    }
  }
  if(anchorDownload(blob,name)){
    $('msg').textContent='ডাউনলোড শুরু হয়েছে। না হলে নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।';
  }else{
    $('msg').textContent='নিচের ছবি চেপে ধরে "ছবি সংরক্ষণ" দিন।';
  }
});

});

$('hfont').addEventListener('change',()=>{document.fonts&&document.fonts.load&&document.fonts.load('600 50px '+(HFONTS[$('hfont').value]||HF),'অআকখ').then(draw).catch(()=>{})});
$('pasteBtn').onclick=async()=>{
  try{const s=await navigator.clipboard.readText();if(s){$('headline').value=s.trim();draw();$('msg').textContent=''}else $('msg').textContent='ক্লিপবোর্ড খালি।'}
  catch(e){$('msg').textContent='সরাসরি পেস্ট হয়নি, বক্সে চেপে ধরে পেস্ট দিন।';$('headline').focus()}
};
$('clearBtn').onclick=()=>{$('headline').value='';draw();$('headline').focus()};
$('reset').onclick=()=>{
  $('headline').value='';$('caption').value='';
  photo=null;$('photoLbl').textContent='ছবি বাছুন';$('photo').value='';
  $('zoom').value=100;$('px').value=50;$('py').value=35;
  $('date').value=todayStr();$('msg').textContent='';$('fallback').style.display='none';
  draw();window.scrollTo({top:0,behavior:'smooth'});
};
draw();ensureFont();
if(document.fonts&&document.fonts.load){
  document.fonts.ready.then(draw);
}
